services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zynex
      POSTGRES_PASSWORD: zynex
      POSTGRES_DB: zynex
    ports:
      - "5432:5432"
    volumes:
      - zynex-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - zynex-clickhouse:/var/lib/clickhouse

volumes:
  zynex-postgres:
  zynex-clickhouse:
