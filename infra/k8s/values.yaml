global:
  namespace: zynex

images:
  pullSecrets: []
  web:
    repository: ghcr.io/sarankumarsankar12/zynex-web
    tag: latest
    pullPolicy: IfNotPresent
  api:
    repository: ghcr.io/sarankumarsankar12/zynex-api
    tag: latest
    pullPolicy: IfNotPresent

web:
  replicas: 1
  port: 3000
  env:
    NEXT_PUBLIC_ZYNEX_API_URL: https://api.zynex.zyfrr.com
    NEXTAUTH_URL: https://zynex.zyfrr.com

api:
  replicas: 1
  port: 4101
  env:
    NODE_ENV: production
    ZYNEX_API_PORT: "4101"
    WEB_ORIGIN: https://zynex.zyfrr.com
    REDIS_URL: redis://zynex-redis:6379
    CLICKHOUSE_URL: http://zynex-clickhouse:8123
    ZYNEX_COOKIE_DOMAIN: .zyfrr.com
    ZYNEX_COOKIE_SECURE: "true"
    ZYNEX_DEFAULT_PROVIDER: Groq
    ZYNEX_DEFAULT_MODEL: llama-3.3-70b-versatile

secrets:
  create: true
  DATABASE_URL: postgresql://USER:PASSWORD@HOST:5432/zynex
  ZYNEX_JWT_SECRET: replace-with-a-long-random-api-secret
  NEXTAUTH_SECRET: replace-with-a-long-random-nextauth-secret
  GROQ_API_KEY: ""
  OPENROUTER_API_KEY: ""
  OPENAI_API_KEY: ""
  RESEND_API_KEY: ""
  SPACESHIP_SMTP_HOST: ""
  SPACESHIP_SMTP_USER: support@zyfrr.com
  SPACESHIP_SMTP_PASS: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_FROM_PHONE: ""

redis:
  enabled: true
  image: redis:7-alpine
  port: 6379
  storage: 1Gi

ingress:
  enabled: true
  className: nginx
  tlsSecretName: zynex-tls
  webHost: zynex.zyfrr.com
  apiHost: api.zynex.zyfrr.com

resources:
  web:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  api:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 700m
      memory: 768Mi
