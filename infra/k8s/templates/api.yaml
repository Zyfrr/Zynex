apiVersion: apps/v1
kind: Deployment
metadata:
  name: zynex-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "zynex.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zynex
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zynex
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.images.pullSecrets | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: zynex-config
            - secretRef:
                name: zynex-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health/ZyNexAPI01HealthCheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/ZyNexAPI01HealthCheck
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: zynex-api
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "zynex.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: zynex
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
